name: wiro_realtime
description: >-
  Official Wiro realtime speech-to-speech, speech-to-text, and text-to-speech
  Flutter example.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  audio_session: ^0.2.4
  audio_stream_player: ^1.1.0
  crypto: ^3.0.7
  dio: ^5.11.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  json_annotation: ^4.12.0
  permission_handler: ^12.0.1
  record: ^7.1.1
  web_socket_channel: ^3.0.3
  wiro_voice_engine:
    path: packages/wiro_voice_engine

dev_dependencies:
  build_runner: ^2.16.0
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
