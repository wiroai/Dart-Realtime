name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: App
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: wiro_voice_engine
        working-directory: packages/wiro_voice_engine
        run: |
          flutter pub get
          flutter analyze
